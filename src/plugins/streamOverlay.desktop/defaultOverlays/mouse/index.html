<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mouse</title>
    <link rel="stylesheet" href="board.css">
    <link rel="stylesheet" href="keys.css">
    <link rel="stylesheet" href="move.css">
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="gothic-panel.css">
    <link rel="stylesheet" href="gothic-keys.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gothic.css">
    <link rel="stylesheet" href="theme-neon.css">
    <link rel="stylesheet" href="theme-porcelain.css">
    <link rel="stylesheet" href="theme-terminal.css">
    <link rel="stylesheet" href="theme-sakura.css">
    <link rel="stylesheet" href="theme-molten.css">
    <link rel="stylesheet" href="theme-royal.css">
    <link rel="stylesheet" href="theme-ocean.css">
</head>
<body>
    <main class="board">
        <div class="buttons">
            <div class="key mod btn-left" data-key="LMB"><div class="cap"><span>LMB</span></div></div>
            <div class="wheel" data-key="MMB">
                <i class="spin"></i>
                <div class="roller"><div class="ribs"></div></div>
                <i class="chev up"></i>
                <i class="chev down"></i>
            </div>
            <div class="key mod btn-right" data-key="RMB"><div class="cap"><span>RMB</span></div></div>
        </div>

        <div class="mouse-bottom">
            <div class="side">
                <div class="key mod btn-m5" data-key="M5" aria-label="M5"><div class="cap"></div></div>
                <div class="key mod btn-m4" data-key="M4" aria-label="M4"><div class="cap"></div></div>
            </div>
            <!-- the first dot is the mouse, the others trail behind it -->
            <div class="pad">
                <i class="dot"></i>
                <i class="dot"></i>
                <i class="dot"></i>
            </div>
        </div>

        <div class="resize" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9" />
            </svg>
        </div>
        <div class="hint">
            <span class="hint-idle">Hold <kbd>Alt</kbd> + <kbd>Caps</kbd> to move or resize</span>
            <span class="hint-armed">Drag to move · drag the corner to resize</span>
        </div>
    </main>

    <script src="keys.js"></script>
    <script src="move.js"></script>
    <script src="script.js"></script>
</body>
</html>
