<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spotify (Obnoxious)</title>
    <link rel="stylesheet" href="board.css">
    <link rel="stylesheet" href="move.css">
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <main class="board" data-state="idle">
        <div class="cover">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 18V5l11-2v13" />
                <circle cx="6.5" cy="18" r="2.5" />
                <circle cx="17.5" cy="16" r="2.5" />
            </svg>
            <img alt="" draggable="false">
        </div>

        <div class="info">
            <div class="title">Nothing playing</div>
            <div class="artist">Start a song in Spotify</div>
            <div class="progress">
                <div class="track"><div class="fill"></div></div>
                <div class="times"><span class="now">0:00</span><span class="total">0:00</span></div>
            </div>
        </div>

        <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

        <div class="resize" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9" />
            </svg>
        </div>
        <div class="hint">
            <span class="hint-idle">Hold <kbd>Alt</kbd> + <kbd>Caps</kbd> to move or resize</span>
            <span class="hint-armed">Drag to move &middot; drag the corner to resize</span>
        </div>
    </main>

    <script src="move.js"></script>
    <script src="script.js"></script>
</body>
</html>
